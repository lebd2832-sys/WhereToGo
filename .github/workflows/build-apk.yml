name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        run: gradle -p WhereToGo :app:assembleDebug --no-daemon
      - name: Rename
        run: cp WhereToGo/app/build/outputs/apk/debug/app-debug.apk WhereToGo.apk
      - uses: actions/upload-artifact@v4
        with: { name: WhereToGo-apk, path: WhereToGo.apk }
      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: WhereToGo.apk }
